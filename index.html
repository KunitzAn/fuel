    <!-- Критический CSS: фон сразу в цвет приложения (светлый или тёмный),
         без белой вспышки до монтирования Vue. -->
    <style>
      html, body { background: #f5f5f4; margin: 0; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0c0a09; }
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-loading img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        animation: app-loading-pulse 1.4s ease-in-out infinite;
      }
      @keyframes app-loading-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>

    <title>Fuel</title>
  </head>
  <body>
    <div id="app">
      <!-- Показывается, пока грузится и монтируется Vue-приложение;
           mount('#app') заменит это содержимое. -->
      <div id="app-loading">
        <img src="/apple-touch-icon.png" alt="" aria-hidden="true" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
